name: Release

# Publishes to npm with provenance when a v* tag is pushed.
#
# Auth: npm "trusted publishing" (OIDC) — configure once on npmjs.com after
# the first manual publish: package → Settings → Trusted Publisher →
# GitHub Actions, repo socraticstatic/chart-color-audit, workflow
# release.yml. No long-lived token anywhere.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC for npm provenance + trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          # NO registry-url here: setup-node would write a placeholder
          # _authToken to .npmrc, which overrides OIDC trusted publishing.
      # Trusted publishing (OIDC token exchange) requires npm >= 11.5.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public

  # Publishes server.json to the official MCP Registry
  # (registry.modelcontextprotocol.io) after the npm publish succeeds.
  #
  # Auth: GitHub Actions OIDC — `mcp-publisher login github-oidc` exchanges
  # the workflow's OIDC token for registry credentials scoped to the
  # io.github.socraticstatic namespace. No stored secret.
  #
  # The registry validates npm ownership by fetching the published package
  # from registry.npmjs.org and checking its `mcpName` field matches
  # server.json's `name` — which is why this job needs the npm job first.
  mcp-registry:
    name: Publish to MCP Registry
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token exchange with the MCP registry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify server.json is in sync with package.json
        run: node scripts/check-server-json.mjs
      # npm accepts the publish and then says "may take a few minutes to become
      # available". The registry validates by fetching that exact version from
      # registry.npmjs.org, so publishing ten seconds after npm is a 404
      # (v0.2.5, 2026-10-04). Wait until npm actually serves it.
      - name: Wait for npm to serve this version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 40); do
            if curl -fsS "https://registry.npmjs.org/chart-color-audit/$VERSION" >/dev/null 2>&1; then
              echo "npm is serving chart-color-audit@$VERSION"
              exit 0
            fi
            echo "attempt $attempt: npm does not serve $VERSION yet, waiting 15s"
            sleep 15
          done
          echo "::error::npm never served chart-color-audit@$VERSION within 10 minutes"
          exit 1

      - name: Install mcp-publisher
        # Pinned release; update deliberately, not via `latest`.
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
