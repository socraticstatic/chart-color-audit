name: Release

# Publishes to npm with provenance when a v* tag is pushed.
#
# Auth: npm "trusted publishing" (OIDC) — configure once on npmjs.com after
# the first manual publish: package → Settings → Trusted Publisher →
# GitHub Actions, repo socraticstatic/chart-color-audit, workflow
# release.yml. No long-lived token anywhere.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC for npm provenance + trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          # NO registry-url here: setup-node would write a placeholder
          # _authToken to .npmrc, which overrides OIDC trusted publishing.
      # Trusted publishing (OIDC token exchange) requires npm >= 11.5.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
